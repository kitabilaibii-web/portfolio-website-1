<!DOCTYPE html>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between">

    <nav class="border-b border-zinc-900 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-600">LAIBA.DEV</span>
        <div class="flex flex-wrap justify-center gap-4 text-sm font-medium">                
               <a href="index.html" class="text-zinc-400 hover:text-amber-400">Home</a>
                <a href="about.html" class="text-zinc-400 hover:text-amber-400">About</a>
                <a href="skills.html" class="text-zinc-400 hover:text-amber-400">Skills</a>

                <a href="contact.html" class="text-amber-400">Contact</a>
            </div>
        </div>
    </nav>

    <section class="max-w-4xl mx-auto px-4 py-16 w-full space-y-12">
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-white">Get In Touch</h1>
            <p class="text-zinc-400 text-sm">Let's discuss modern interface designs and software collaborations.</p>
        </div>

        <div class="grid md:grid-cols-3 gap-4 text-center">
            <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800">
                <i class="fa-solid fa-envelope text-amber-500 text-xl mb-2"></i>
                <p class="text-sm text-zinc-300 font-medium">liaqatlaiba79@gmail.com</p>
            </div>
            <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800">
                <i class="fa-brands fa-github text-amber-500 text-xl mb-2"></i>
                <p class="text-sm text-zinc-300 font-medium">github.com/kitabilaibii-web</p>
            </div>
            <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800">
                <i class="fa-solid fa-location-dot text-amber-500 text-xl mb-2"></i>
                <p class="text-sm text-zinc-300 font-medium">Punjab, Pakistan</p>
            </div>
        </div>

        <div class="bg-zinc-900 p-8 rounded-xl border border-zinc-800 max-w-xl mx-auto w-full">
            <form class="space-y-4" onsubmit="event.preventDefault(); alert('Message systematically dispatched to Laiba Liaqat!');">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" placeholder="Name" required class="bg-zinc-950 border border-zinc-800 p-3 rounded-lg text-white text-sm outline-none focus:border-amber-500 w-full">
                    <input type="email" placeholder="Email" required class="bg-zinc-950 border border-zinc-800 p-3 rounded-lg text-white text-sm outline-none focus:border-amber-500 w-full">
                </div>
                <input type="text" placeholder="Subject" required class="bg-zinc-950 border border-zinc-800 p-3 rounded-lg text-white text-sm outline-none focus:border-amber-500 w-full">
                <textarea placeholder="Message" rows="4" required class="bg-zinc-950 border border-zinc-800 p-3 rounded-lg text-white text-sm outline-none focus:border-amber-500 w-full"></textarea>
                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-zinc-950 font-bold py-3 rounded-lg transition-all shadow-md">Dispatch Transmission</button>
            </form>
        </div>
    </section>

    <footer class="border-t border-zinc-900 bg-zinc-950 py-8 text-center text-sm text-zinc-500 w-full">
